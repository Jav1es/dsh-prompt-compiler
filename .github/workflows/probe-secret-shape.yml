name: probe-secret-shape
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: 打印 secret 的形状（不泄露内容）
        env:
          TOK: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "长度=${#TOK}"
          echo "前4位=${TOK:0:4}"
          echo "末4位=${TOK: -4}"
          echo "SHA256前16位=$(printf '%s' "$TOK" | sha256sum | cut -c1-16)"
          case "$TOK" in
            *XXXXX*) echo "结论=掩码" ;;
            npm_*)   echo "结论=真token" ;;
            *)       echo "结论=其他" ;;
          esac